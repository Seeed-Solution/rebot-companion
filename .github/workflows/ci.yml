name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml: requires-python >= 3.10
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install ffmpeg (snapshot decoder test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        # all extras: [agent] (mcp, av, pillow) and [calib] (opencv) are imported by the tests
        run: uv sync --locked --all-extras
      - name: Lint
        run: |
          uv run --locked --all-extras ruff check
          uv run --locked --all-extras ruff format --check
      - name: Test
        run: uv run --locked --all-extras pytest -q -rs

  stdlib-core:
    # rebot/ runs on the reCamera's python3 (no numpy/httpx/websockets): Python 3.8, standard library only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Import without third-party packages
        run: uv run --python 3.8 --no-project python -c "import sys; sys.path.insert(0, '.'); import rebot; print(rebot.__name__)"
      - name: Test rebot on Python 3.8
        # pytest and websockets (test servers) are test-only; nothing else is installed
        run: >-
          uv run --python 3.8 --no-project --with pytest --with "websockets>=12"
          python -m pytest -q -p no:cacheprovider
          tests/test_ws.py tests/test_arm_facade.py tests/test_arm_client.py tests/test_arm_actions.py

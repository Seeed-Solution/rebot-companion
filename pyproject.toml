[project]
name = "rebot-companion"
version = "0.1.0"
description = "Robot Arm Vision Companion SDK & Orchestration Toolkit for Seeed reCamera and rebot-armd"
readme = "README.md"
authors = [{ name = "Seeed Studio" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.scripts]
rebot-mcp = "rebot_companion.mcp_server:main"

[project.optional-dependencies]
calib = [
    "opencv-python-headless>=4.8,<5",
]
agent = [
    "av>=12",
    "mcp>=2.3,<3",  # 2.x API: mcp.server.mcpserver.MCPServer (FastMCP was renamed)
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=) would change runtime behaviour

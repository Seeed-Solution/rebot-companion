[project]
name = "rebot-companion"
version = "0.1.0"
description = "Python SDK and MCP server for a reBot B601-DM arm driven by rebot-armd, with Seeed reCamera snapshots and detections"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seeed Studio" }]
requires-python = ">=3.10"
keywords = ["robotics", "robot-arm", "rebot", "recamera", "mcp", "hand-eye-calibration", "seeed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/Seeed-Solution/rebot-companion"
Repository = "https://github.com/Seeed-Solution/rebot-companion"
Issues = "https://github.com/Seeed-Solution/rebot-companion/issues"

[project.scripts]
rebot-mcp = "rebot_companion.mcp_server:main"

[project.optional-dependencies]
calib = [
    "opencv-python-headless>=4.8,<5",
]
agent = [
    "av>=12",
    "mcp>=2.3,<3",  # 2.x API: mcp.server.mcpserver.MCPServer (FastMCP was renamed)
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rebot", "rebot_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6",
    "websockets>=12.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=) would change runtime behaviour

[tool.ruff.lint.per-file-ignores]
# rebot/ runs on Python 3.8 (reCamera): keep typing.Optional/Union in runtime positions
"rebot/**" = ["UP"]

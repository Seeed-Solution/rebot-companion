[project]
name = "rebot-companion"
version = "0.1.0"
description = "Robot Arm Vision Companion SDK & Orchestration Toolkit for Seeed reCamera and rebot-armd"
readme = "README.md"
authors = [{ name = "Seeed Studio" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
